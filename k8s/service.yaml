apiVersion: v1
kind: Service
metadata:
  name: fractime-service
spec:
  selector:
    app: fractime
  ports:
  - port: 80
    targetPort: 8501
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fractime-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "fractime-cert"
    kubernetes.io/ingress.global-static-ip-name: "fractime-ip"
spec:
  rules:
  - host: fractime.example.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fractime-service
            port:
              number: 80